version: "3"

services:
  server:
    # build: .
    container_name: 'push-all-in-cloud'
    image: ${DOCKER_IMAGE:-caomeiyouren/push-all-in-cloud}
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: "Asia/Shanghai"
      AUTH_PUSH_KEY: ${AUTH_PUSH_KEY:-}
      AUTH_FORWARD_KEY: ${AUTH_FORWARD_KEY:-}
      ALLOW_PUBLIC_FORWARD: ${ALLOW_PUBLIC_FORWARD:-false}
    volumes:
      - ./logs:/app/logs
